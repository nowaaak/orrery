name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  companion:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build the companion mod for every supported version
        run: node scripts/companion.mjs
      - uses: actions/upload-artifact@v5
        with:
          name: companion
          path: |
            src-tauri/resources/companion/*.jar
            src-tauri/resources/companion/companion.json
          if-no-files-found: error

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: mkdir -p dist
        shell: bash
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Check generated TypeScript bindings are committed
        run: git diff --exit-code -- src/bindings
        shell: bash
      - name: Compile the Orrery shader pack
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y glslang-tools
          cargo run --example shader_check
