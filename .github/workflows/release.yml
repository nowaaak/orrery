name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  companion:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build the companion mod for every supported version
        run: node scripts/companion.mjs
      - uses: actions/upload-artifact@v5
        with:
          name: companion
          path: |
            src-tauri/resources/companion/*.jar
            src-tauri/resources/companion/companion.json
          if-no-files-found: error

  build:
    needs: companion
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - uses: actions/download-artifact@v5
        with:
          name: companion
          path: src-tauri/resources/companion

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LAUNCHER_REPOSITORY_URL: https://github.com/${{ github.repository }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Orrery ${{ github.ref_name }}
          releaseBody: |
            Orrery is an independent, open-source launcher for Minecraft: Java Edition. Playing requires a Microsoft account that owns Minecraft: Java Edition.

            NOT AN OFFICIAL MINECRAFT PRODUCT. NOT APPROVED BY OR ASSOCIATED WITH MOJANG OR MICROSOFT.

            See CHANGELOG.md for all changes.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
